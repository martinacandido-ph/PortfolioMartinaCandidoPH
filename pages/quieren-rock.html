<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>"Quieren Rock!" — Martina Candido</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { 
      --pad: 24px; 
    }

    html, body {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      color: #000;
      width: 100%;
      overflow-x: hidden;
    }

    /* ── IMAGEN FIJA DE FONDO ── */
    .fondo-fijo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
    }

    .fondo-fijo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── CONTENIDO DESLIZANTE ── */
    .contenido {
      position: relative;
      z-index: 10;
    }

    /* ══════════════════════
       NAVBAR (Idéntico al Inicio)
    ══════════════════════ */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px var(--pad);
      background: #2b2b2b;
      width: 100%;
    }

    .logo {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      color: #f9f9f9;
      white-space: nowrap;
    }

    .nav-toggle {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 34px; height: 34px;
      background: none; border: none;
      cursor: pointer; padding: 6px; z-index: 2;
    }
    .nav-toggle span {
      display: block; width: 22px; height: 2px;
      background: #f9f9f9; border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav-links {
      list-style: none;
      position: absolute;
      top: 100%; left: 0; right: 0;
      display: flex; flex-direction: column;
      background: #2b2b2b;
      max-height: 0; overflow: hidden;
      transition: max-height 0.32s ease;
    }
    .nav-links.open {
      max-height: 320px;
      border-bottom: 1px solid #444;
    }
    .nav-links li { width: 100%; }
    .nav-links a {
      display: block;
      padding: 14px var(--pad);
      text-decoration: none;
      color: #f9f9f9;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: #9c9c9c; }

    /* ── HERO TÍTULO ── */
    .proyecto-hero {
      width: 100%;
      padding: 60px var(--pad) 40px;
      background: #fff;
    }

    .proyecto-hero h1 {
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 800;
      color: #111;
      letter-spacing: -1.5px;
      line-height: 1.05;
      text-transform: uppercase;
    }

    .proyecto-hero p {
      font-size: 12px;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 14px;
    }

    /* ── GRILLA FOTOS ── */
    .fotos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 var(--pad) 60px;
      background: #fff;
    }

    .foto-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .foto-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .foto-item:hover img { transform: scale(1.04); }

    /* ── VENTANA TRANSPARENTE ── */
    .ventana {
      height: 100vh;
      background: transparent;
      position: relative;
      z-index: 5;
    }

    /* ── SECCIÓN VIDEO ── */
    .video-section {
      width: 100%;
      background: #fff;
      padding: 80px var(--pad);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .video-section-titulo {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      align-self: flex-start;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      background: #111;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      z-index: 2;
    }

    /* ── SECTOR: GRID ASIMÉTRICO ── */
    .seccion-asimetrica {
      width: 100%;
      background: #fff;
      padding: 0 var(--pad) 80px;
    }

    .grid-asimetrico {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      align-items: center;
    }

    .mod-izq {
      aspect-ratio: 9 / 16;
      overflow: hidden;
    }

    .mod-der {
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .grid-asimetrico img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .grid-asimetrico img:hover {
      transform: scale(1.04);
    }

    /* ══════════════════════
       FOOTER (Idéntico al Inicio)
    ══════════════════════ */
    footer {
      width: 100%;
      background: #000;
      padding: 40px var(--pad);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px 10px;
    }

    .footer-titulo {
      font-size: 9px;
      font-weight: 700;
      color: #f9f9f9;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .footer-links { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .footer-links a {
      text-decoration: none;
      color: #888;
      font-size: 11px;
      font-weight: 400;
      transition: color 0.3s;
    }
    .footer-links a:hover { color: #f9f9f9; }

    .footer-contacto { display: flex; flex-direction: column; gap: 8px; }
    .footer-contacto p {
      color: #888; font-size: 11px; font-weight: 400;
      text-decoration: none; word-break: break-word;
      transition: color 0.3s;
    }
    .footer-contacto a:hover { color: #f9f9f9; }

    .footer-redes { display: flex; gap: 10px; margin-top: 4px; }
    .footer-redes a {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid #444;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.3s;
    }
    .footer-redes a:hover { border-color: #f9f9f9; }
    .footer-redes svg { width: 14px; height: 14px; fill: #888; transition: fill 0.3s; }
    .footer-redes a:hover svg { fill: #f9f9f9; }

    /* ── ANIMACIONES ── */
    .fade-in { 
      opacity: 0; 
      transform: translateY(24px); 
      transition: opacity 0.7s ease, transform 0.7s ease; 
    }
    .fade-in.visible { 
      opacity: 1; 
      transform: translateY(0); 
    }

    /* ══════════════════════
       RESPONSIVE
    ══════════════════════ */
    @media (min-width: 640px) {
      :root { --pad: 40px; }

      .nav-toggle { display: none; }
      .nav-links {
        position: static; flex-direction: row; align-items: center;
        background: none; max-height: none; overflow: visible;
        border: none;
      }
      .nav-links li { width: auto; margin-left: 32px; }
      .nav-links a { padding: 0; font-size: 12px; }
    }

    @media (min-width: 900px) {
      :root { --pad: 60px; }

      .nav-links a { font-size: 13px; }
      .logo { font-size: 13px; }

      footer { padding: 48px 60px; gap: 28px 40px; }
      .footer-titulo { font-size: 10px; }
      .footer-links a, .footer-contacto a { font-size: 12px; }
      .footer-redes a { width: 32px; height: 32px; }
    }

    @media (max-width: 639px) {
      .fotos-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .grid-asimetrico { gap: 10px; }
    }
  </style>
</head>

  <script>
    // Fade in en scroll
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Menú hamburguesa (Mobile)
    (function () {
      const toggle = document.getElementById('navToggle');
      const links = document.getElementById('navLinks');
      if (!toggle || !links) return;
      toggle.addEventListener('click', function () {
        const open = links.classList.toggle('open');
        toggle.classList.toggle('open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      links.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { 
          links.classList.remove('open'); 
          toggle.classList.remove('open'); 
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    })();
  </script>
