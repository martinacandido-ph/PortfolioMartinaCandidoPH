<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>"Quieren Rock!" — Martina Candido</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'DM Sans', sans-serif;
      background: #fff;
      width: 100%;
      overflow-x: hidden;
    }

    /* ── IMAGEN FIJA DE FONDO — nunca se mueve ── */
    .fondo-fijo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      z-index: 0;
    }

    .fondo-fijo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── TODO EL CONTENIDO se desliza encima de la imagen fija ── */
    .contenido {
      position: relative;
      z-index: 10;
    }

    /* ── NAVBAR ── */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
      color: #111;
    }

    .nav-links { display: flex; list-style: none; }
    .nav-links li { margin-left: 80px; }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      font-size: 16px;
      transition: 0.3s;
    }
    .nav-links a:hover { color: #888; }

    /* ── HERO TÍTULO ── */
    .proyecto-hero {
      width: 100%;
      padding: 80px 60px 60px;
      background: #fff;
    }

    .proyecto-hero h1 {
      font-size: 72px;
      font-weight: 700;
      color: #111;
      letter-spacing: -2px;
      line-height: 1;
      text-transform: uppercase;
    }

    .proyecto-hero p {
      font-size: 14px;
      font-weight: 300;
      color: #aaa;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 16px;
    }

    /* ── GRILLA FOTOS ── */
    .fotos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 60px 60px;
      background: #fff;
    }

    .foto-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .foto-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .foto-item:hover img { transform: scale(1.04); }

    /* ── VENTANA TRANSPARENTE — aquí se ve la imagen fija ── */
    .ventana {
      height: 100vh;
      background: transparent;
      position: relative;
      z-index: 5;
    }

    /* ── SECCIÓN VIDEO ── */
    .video-section {
      width: 100%;
      background: #fff;
      padding: 100px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .video-section-titulo {
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      align-self: flex-start;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-wrapper .play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .video-wrapper .play-icon svg {
      width: 56px;
      height: 56px;
      fill: rgba(255,255,255,0.85);
    }

    /* ── FOOTER ── */
    footer {
      width: 100%;
      background: #111;
      border-top: 1px solid #1a1a1a;
      padding: 48px 60px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px;
    }

    .footer-titulo {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .footer-links { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .footer-links a { text-decoration: none; color: #aaa; font-size: 14px; font-weight: 300; transition: color 0.3s; }
    .footer-links a:hover { color: #fff; }
    .footer-contacto { display: flex; flex-direction: column; gap: 8px; }
    .footer-contacto p { color: #aaa; font-size: 14px; font-weight: 300; }
    .footer-redes { display: flex; gap: 12px; margin-top: 4px; }
    .footer-redes a { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; transition: border-color 0.3s; }
    .footer-redes a:hover { border-color: #fff; }
    .footer-redes svg { width: 16px; height: 16px; fill: #aaa; transition: fill 0.3s; }
    .footer-redes a:hover svg { fill: #fff; }

    /* ── FADE IN ── */
    .fade-in { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
      .navbar { padding: 12px 16px; }
      .logo { font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
      .nav-links li { margin-left: 12px; }
      .nav-links a { font-size: 11px; }

      footer {
        padding: 24px 16px;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      .footer-titulo { font-size: 9px; letter-spacing: 0.08em; margin-bottom: 10px; }
      .footer-links a { font-size: 10px; }
      .footer-contacto p { font-size: 9px; }
      .footer-redes a { width: 26px; height: 26px; }
      .footer-redes svg { width: 12px; height: 12px; }
      .footer-redes { gap: 8px; }

      
      .proyecto-hero { padding: 60px 30px 40px; }
      .proyecto-hero h1 { font-size: 40px; }
      .fotos-grid { grid-template-columns: 1fr; gap: 6px; padding: 0 16px 40px; }
      .video-section { padding: 60px 24px; }
      .grid-asimetrico { grid-template-columns: 1fr 2fr !important; gap: 10px !important; padding: 20px 16px 30px !important; }
      .seccion-asimetrica { padding: 0 !important; }
    }
  
    /* ── Menú hamburguesa (solo mobile) ── */
    .nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 34px; height: 34px; background: none; border: none; cursor: pointer; padding: 6px; z-index: 101; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: #111; border-radius: 2px; transition: transform .3s ease, opacity .2s ease; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    @media (max-width: 768px) {
      .navbar { position: sticky; top: 0; z-index: 100; }
      .nav-toggle { display: flex; }
      .nav-links { position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: flex-start; background: #fff; max-height: 0; overflow: hidden; margin: 0; transition: max-height .32s ease; }
      .nav-links.open { max-height: 260px; border-bottom: 1px solid #e2e0e0; box-shadow: 0 12px 20px rgba(0,0,0,.06); }
      .nav-links li { margin: 0 !important; width: 100%; }
      .nav-links a { display: block; padding: 14px 16px; font-size: 15px !important; }
    }
  </style>
</head>

  <script>
    // Fade in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Clic para reproducir con sonido
    const wrapper = document.querySelector('.video-wrapper');
    const video = wrapper.querySelector('video');
    const overlay = wrapper.querySelector('.play-icon');

    wrapper.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        overlay.style.opacity = '0';
      } else {
        video.pause();
        overlay.style.opacity = '1';
      }
    });
  </script>


  <script>
    (function () {
      var t = document.querySelector('.nav-toggle'), l = document.getElementById('navLinks');
      if (!t || !l) return;
      t.addEventListener('click', function () {
        var o = l.classList.toggle('open');
        t.classList.toggle('open', o);
        t.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
      l.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { l.classList.remove('open'); t.classList.remove('open'); });
      });
    })();
  </script>
