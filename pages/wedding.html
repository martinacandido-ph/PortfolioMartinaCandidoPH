<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding — Martina Candido</title>

     <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'DM Sans', sans-serif;
      background: #fff;
      width: 100%;
      overflow-x: hidden;
    }

    /* ── NAVBAR ── */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background-color: #fff;
      border-bottom: 1px solid #eee;
      width: 100%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
      color: #111;
    }

    .nav-links { display: flex; list-style: none; }
    .nav-links li { margin-left: 80px; }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      font-size: 16px;
      transition: 0.3s;
    }
    .nav-links a:hover { color: #888; }

    /* ── HERO ── */
    .proyecto-hero {
      padding: 70px 60px 30px;
      position: relative;
      z-index: 2;
      background: #fff;
    }
    .proyecto-hero .eyebrow {
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #999;
      font-weight: 500;
      margin-bottom: 14px;
    }
    .proyecto-hero h1 {
      font-size: 52px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.01em;
    }

    /* ── GALERIAS ── */
    .galeria-wrap {
      position: relative;
      z-index: 2;
      background: #fff;
      padding: 40px 60px 0;
    }

    .fila-dos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    .fila-tres {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 14px;
      margin-bottom: 400px;
    }

    .fila-dos figure, .fila-tres figure {
      overflow: hidden;
      background: #eee;
    }
    .fila-dos img {
      width: 100%;
      height: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .fila-tres img {
      width: 100%;
      height: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .fila-dos img:hover, .fila-tres img:hover { transform: scale(1.04); }

    /* ── FONDO FIJO (ventana) ── */
    .fondo-fijo-anchor {
      position: relative;
      height: 90vh;
      z-index: 1;
    }
    .fondo-fijo-anchor .fondo-fijo-img {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }
    .fondo-fijo-anchor .fondo-fijo-caption {
      position: absolute;
      bottom: 40px;
      left: 60px;
      color: #fff;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-shadow: 0 1px 6px rgba(0,0,0,0.4);
    }

    /* Cierra la ventana: todo lo que viene después vuelve a tapar el fondo fijo */
    .post-fondo {
      position: relative;
      z-index: 2;
      background: #fff;
      padding: 70px 0;
    }
    .px-page { padding: 0 60px; }

    /* ── VIDEO ── */
    .video-wrap {
      position: relative;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }
    .video-wrap video {
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.28);
      transition: opacity 0.3s ease, background 0.3s ease;
    }
    .play-overlay .play-icon {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }
    .play-overlay .play-icon svg { width: 24px; height: 24px; fill: #111; margin-left: 4px; }
    .video-wrap:hover .play-overlay { background: rgba(0,0,0,0.4); }
    .video-wrap:hover .play-icon { transform: scale(1.08); }
    .video-wrap.playing .play-overlay { opacity: 0; pointer-events: none; }

    /* ── GRILLA DE 6 FOTOS HORIZONTALES ── */
    .fila-seis {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .fila-seis figure { overflow: hidden; background: #eee; }
    .fila-seis img {
      width: 100%;
      height: 100%;
      aspect-ratio: 3 / 2;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }
    .fila-seis img:hover { transform: scale(1.04); }

    /* ── FOTO HORIZONTAL A TODO EL ANCHO ── */
    .foto-full { width: 100%; overflow: hidden; }
    .foto-full img {
      width: 100%;
      height: auto;
      aspect-ratio: 21 / 9;
      object-fit: cover;
      display: block;
    }

    .post-fondo .bloque + .bloque { margin-top: 40px; }

    .post-fondo p {
      max-width: 640px;
      color: #333;
      font-size: 17px;
      line-height: 1.7;
    }

    footer {
      width: 100%;
      background: #111;
      padding: 48px 60px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 40px;
      position: relative;
      z-index: 2;
    }

    .footer-titulo {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .footer-links { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .footer-links a { text-decoration: none; color: #aaa; font-size: 14px; font-weight: 300; transition: color 0.3s; }
    .footer-links a:hover { color: #fff; }
    .footer-contacto { display: flex; flex-direction: column; gap: 8px; }
    .footer-contacto p { color: #aaa; font-size: 14px; font-weight: 300; }
    .footer-redes { display: flex; gap: 12px; margin-top: 4px; }
    .footer-redes a { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; transition: border-color 0.3s; }
    .footer-redes a:hover { border-color: #fff; }
    .footer-redes svg { width: 16px; height: 16px; fill: #aaa; transition: fill 0.3s; }
    .footer-redes a:hover svg { fill: #fff; }

    /* ── FADE IN ── */
    .fade-in { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 768px) {
      .navbar { padding: 12px 16px; }
      .logo { font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
      .nav-links li { margin-left: 12px; }
      .nav-links a { font-size: 11px; }

      footer {
        padding: 24px 16px;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      .footer-titulo { font-size: 9px; letter-spacing: 0.08em; margin-bottom: 10px; }
      .footer-links a { font-size: 10px; }
      .footer-contacto p { font-size: 9px; }
      .footer-redes a { width: 26px; height: 26px; }
      .footer-redes svg { width: 12px; height: 12px; }
      .footer-redes { gap: 8px; }

     
      .proyecto-hero { padding: 60px 24px 20px; }
      .proyecto-hero h1 { font-size: 34px; }
      .galeria-wrap { padding: 24px 24px 0; }
      .fila-dos { grid-template-columns: 1fr; }
      .fila-tres { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .fondo-fijo-anchor { height: 60vh; }
      .fondo-fijo-anchor .fondo-fijo-caption { left: 24px; bottom: 24px; }
      .post-fondo { padding: 50px 0; }
      .px-page { padding: 0 24px; }
      .fila-seis { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .play-overlay .play-icon { width: 56px; height: 56px; }
      .post-fondo .bloque + .bloque { margin-top: 28px; }
      
    }
  
    @media (max-width: 768px) { .fila-tres { margin-bottom: 90px; } }

  
    /* ── Menú hamburguesa (solo mobile) ── */
    .nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 34px; height: 34px; background: none; border: none; cursor: pointer; padding: 6px; z-index: 101; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: #111; border-radius: 2px; transition: transform .3s ease, opacity .2s ease; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    @media (max-width: 768px) {
      .navbar { position: sticky; top: 0; z-index: 100; }
      .nav-toggle { display: flex; }
      .nav-links { position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: flex-start; background: #fff; max-height: 0; overflow: hidden; margin: 0; transition: max-height .32s ease; }
      .nav-links.open { max-height: 260px; border-bottom: 1px solid #e2e0e0; box-shadow: 0 12px 20px rgba(0,0,0,.06); }
      .nav-links li { margin: 0 !important; width: 100%; }
      .nav-links a { display: block; padding: 14px 16px; font-size: 15px !important; }
    }
  </style>
</head>

    <script>
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.15 });
      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

      document.querySelectorAll('.video-wrap').forEach(wrap => {
        const video = wrap.querySelector('video');
        wrap.addEventListener('click', () => {
          if (video.paused) {
            video.play();
            wrap.classList.add('playing');
          } else {
            video.pause();
            wrap.classList.remove('playing');
          }
        });
        video.addEventListener('ended', () => wrap.classList.remove('playing'));
      });
    </script>


  <script>
    (function () {
      var t = document.querySelector('.nav-toggle'), l = document.getElementById('navLinks');
      if (!t || !l) return;
      t.addEventListener('click', function () {
        var o = l.classList.toggle('open');
        t.classList.toggle('open', o);
        t.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
      l.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { l.classList.remove('open'); t.classList.remove('open'); });
      });
    })();
  </script>
