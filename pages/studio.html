<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio — Martina Candido</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    body {
      font-family: 'DM Sans', sans-serif;
      background: #eeecec;
      width: 100%;
    }
 
    /* ── NAVBAR ── */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 50px;
      background-color: #eeecec;
      border-bottom: 1px solid #eee;
      width: 100%;
    }
 
    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }
 
    .nav-links {
      display: flex;
      list-style: none;
    }
 
    .nav-links li { margin-left: 80px; }
 
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
      font-size: 16px;
      transition: 0.3s;
    }
 
    .nav-links a:hover { color: #888; }

     /* ── FOOTER ── */
footer {
  width: 100%;
  background: #111111;
  padding: 48px 60px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 40px;
}

.footer-titulo {
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.footer-links {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.footer-links a {
  text-decoration: none;
  color: #aaaaaa;
  font-size: 14px;
  font-weight: 300;
  transition: color 0.3s;
}

.footer-links a:hover { color: #ffffff; }

.footer-contacto {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.footer-contacto p {
  color: #aaaaaa;
  font-size: 14px;
  font-weight: 300;
}

.footer-redes {
  display: flex;
  gap: 12px;
  margin-top: 4px;
}

.footer-redes a {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid #444;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.3s;
}

.footer-redes a:hover { border-color: #fff; }

.footer-redes svg {
  width: 16px;
  height: 16px;
  fill: #aaaaaa;
  transition: fill 0.3s;
}

.footer-redes a:hover svg { fill: #ffffff; }
 
    /* Responsive */
    @media (max-width: 768px) {
      .navbar { padding: 12px 16px; }
      .logo { font-size: 13px; letter-spacing: 1px; white-space: nowrap; }
      .nav-links li { margin-left: 12px; }
      .nav-links a { font-size: 11px; }

      footer {
        padding: 24px 16px;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
      }
      .footer-titulo { font-size: 9px; letter-spacing: 0.08em; margin-bottom: 10px; }
      .footer-links a { font-size: 10px; }
      .footer-contacto p { font-size: 9px; }
      .footer-redes a { width: 26px; height: 26px; }
      .footer-redes svg { width: 12px; height: 12px; }
      .footer-redes { gap: 8px; }

      .bloque-tres {
        flex-direction: column !important;
        align-items: center !important;
        padding: 10px 16px 40px !important;
      }

.bloque-tres > div {
  width: 100% !important;
  aspect-ratio: 3/4;
}
    }

 
    /* ── HERO TÍTULO ── */
    .proyecto-hero { width: 100%; padding: 70px 16px 26px; background: #fff; }
    .proyecto-hero h1 { font-size: 40px; font-weight: 700; color: #111; letter-spacing: -1px; line-height: 1; text-transform: uppercase; }
    .proyecto-hero p { font-size: 13px; font-weight: 300; color: #aaa; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 14px; }
    @media (min-width: 900px) { .proyecto-hero { padding: 80px 60px 40px; } .proyecto-hero h1 { font-size: 64px; } }

 
    /* ── Menú hamburguesa (solo mobile) ── */
    .nav-toggle { display: none; flex-direction: column; justify-content: center; gap: 5px; width: 34px; height: 34px; background: none; border: none; cursor: pointer; padding: 6px; z-index: 101; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: #111; border-radius: 2px; transition: transform .3s ease, opacity .2s ease; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    @media (max-width: 768px) {
      .navbar { position: sticky; top: 0; z-index: 100; }
      .nav-toggle { display: flex; }
      .nav-links { position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: flex-start; background: #eeecec; max-height: 0; overflow: hidden; margin: 0; transition: max-height .32s ease; }
      .nav-links.open { max-height: 260px; border-bottom: 1px solid #e2e0e0; box-shadow: 0 12px 20px rgba(0,0,0,.06); }
      .nav-links li { margin: 0 !important; width: 100%; }
      .nav-links a { display: block; padding: 14px 16px; font-size: 15px !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var t = document.querySelector('.nav-toggle'), l = document.getElementById('navLinks');
      if (!t || !l) return;
      t.addEventListener('click', function () {
        var o = l.classList.toggle('open');
        t.classList.toggle('open', o);
        t.setAttribute('aria-expanded', o ? 'true' : 'false');
      });
      l.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () { l.classList.remove('open'); t.classList.remove('open'); });
      });
    })();
  </script>
